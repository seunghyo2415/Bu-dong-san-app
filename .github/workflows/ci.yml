# GitHub 에 올릴 때마다 자동 테스트: 공용 계산·수집기·타입 검사 + PostGIS DB 테스트 + 수집기 끝-끝 테스트
name: 테스트

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 공용 계산·수집기 테스트
        run: npm test
      - name: 타입 검사
        run: npm run typecheck
      - name: DB 테스트 (마이그레이션 + 수집·매칭·커뮤니티 권한)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          npm run test:db
      - name: 수집기 끝-끝 테스트 (가짜 API → 실제 DB)
        run: |
          MIGRATE_ONLY=1 TEST_DB=e2e bash supabase/tests/run.sh
          TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/e2e npm test -w ingest
